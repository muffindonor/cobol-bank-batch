name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol3
      - name: Show compiler version
        run: cobc --version | head -1
      - name: Run tests
        run: bash tests/run_tests.sh
